apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow

resources:
  - ../../base
  - service-monitor.yaml

images:
  - name: DOCKERHUB_USER/taskflow-backend
    newName: DOCKERHUB_USER/taskflow-backend
    newTag: latest
  - name: DOCKERHUB_USER/taskflow-frontend
    newName: DOCKERHUB_USER/taskflow-frontend
    newTag: latest

patches:
  - path: patch-replicas.yaml
