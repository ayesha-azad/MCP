name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/taskflow-backend
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/taskflow-frontend

jobs:
  # ============================================================
  # JOB 1 — Lint & Test
  # ============================================================
  test:
    name: Lint & Test
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend deps
        working-directory: backend
        run: npm ci || npm install

      - name: Frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Frontend build check
        working-directory: frontend
        run: npm run build

  # ============================================================
  # JOB 2 — Build & Push Docker images
  # ============================================================
  build-and-push:
    name: Build & Push Images
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.meta_backend.outputs.version }}
      frontend_tag: ${{ steps.meta_frontend.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          outputs: |
            version=${{ github.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================
  # JOB 3 — Spin up Kind cluster with the full stack
  # ============================================================
  deploy-to-kind:
    name: Kind + ArgoCD + Monitoring
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Kind cluster ---
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: taskflow-cluster
          registry: true
          registry_port: 5001

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      # --- ArgoCD ---
      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd
          kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Register TaskFlow app in ArgoCD
        run: |
          # Patch the Application manifest with this repo URL and image tags
          sed -i "s|YOUR_GITHUB_USER/taskflow|${{ github.repository }}|g" argocd/application.yaml
          sed -i "s|YOUR_GITHUB_USER|${{ vars.DOCKERHUB_USERNAME }}|g" argocd/application.yaml argocd/project.yaml
          sed -i "s|DOCKERHUB_USER|${{ vars.DOCKERHUB_USERNAME }}|g" k8s/overlays/dev/kustomization.yaml

          kubectl apply -f argocd/project.yaml
          kubectl apply -f argocd/application.yaml

          echo "Waiting for ArgoCD to sync the app..."
          sleep 20
          kubectl get applications -n argocd

      # --- Prometheus + Grafana ---
      - name: Install kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          kubectl create namespace monitoring
          helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.service.type=NodePort \
            --set grafana.service.nodePort=32000 \
            --set prometheus.service.type=NodePort \
            --set prometheus.service.nodePort=32090 \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.retention=6h \
            --set prometheus.prometheusSpec.resources.requests.memory=256Mi \
            --set prometheus.prometheusSpec.resources.limits.memory=1Gi \
            --wait --timeout=10m

      - name: Wait for TaskFlow to be healthy
        run: |
          kubectl wait --for=condition=available --timeout=180s deployment/taskflow-backend -n taskflow || true
          kubectl wait --for=condition=available --timeout=180s deployment/taskflow-frontend -n taskflow || true
          kubectl get pods -n taskflow
          kubectl get svc -n taskflow

      - name: Smoke test backend API
        run: |
          kubectl port-forward -n taskflow svc/taskflow-backend 5000:5000 &
          sleep 5
          curl -f http://localhost:5000/health
          curl -f http://localhost:5000/metrics | head -20
          curl -X POST http://localhost:5000/api/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"Smoke test task"}'
          curl -f http://localhost:5000/api/tasks

      - name: Dump diagnostics
        if: always()
        run: |
          echo "=== ArgoCD Apps ==="
          kubectl get applications -n argocd -o wide || true
          echo "=== All Pods ==="
          kubectl get pods -A || true
          echo "=== TaskFlow Events ==="
          kubectl get events -n taskflow --sort-by=.lastTimestamp || true

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name taskflow-cluster
