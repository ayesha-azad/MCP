name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/taskflow-backend
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/taskflow-frontend
  KIND_CLUSTER: taskflow-cluster

jobs:
  # ============================================================
  # JOB 1 — Lint & Test
  # ============================================================
  test:
    name: Lint & Test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend deps
        working-directory: backend
        run: npm ci

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Frontend build check
        working-directory: frontend
        run: npm run build

  # ============================================================
  # JOB 2 — Build & Push Docker images
  # ============================================================
  build-and-push:
    name: Build & Push Images
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub credentials
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "Repository variable DOCKERHUB_USERNAME is not set"
            exit 1
          fi

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================
  # JOB 3 — Kind smoke test (app + optional GitOps/monitoring)
  # ============================================================
  deploy-to-kind:
    name: Kind + ArgoCD + Monitoring
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Load app images into Kind
        run: |
          docker pull "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker pull "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          kind load docker-image "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" --name "${{ env.KIND_CLUSTER }}"
          kind load docker-image "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" --name "${{ env.KIND_CLUSTER }}"

      - name: Deploy TaskFlow with Kustomize
        run: |
          USERNAME="${{ vars.DOCKERHUB_USERNAME }}"
          TAG="${{ github.sha }}"

          find k8s -type f -name '*.yaml' -exec sed -i "s|DOCKERHUB_USER|${USERNAME}|g" {} +
          sed -i "s|newTag: .*|newTag: ${TAG}|" k8s/overlays/dev/kustomization.yaml
          sed -i "s|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|g" k8s/base/*-deployment.yaml
          # ServiceMonitor CRDs are installed later with kube-prometheus-stack
          sed -i '/service-monitor.yaml/d' k8s/overlays/dev/kustomization.yaml

          echo "---- rendered overlay ----"
          kubectl kustomize k8s/overlays/dev | grep -E "image:|kind:"

          kubectl apply -k k8s/overlays/dev

      - name: Wait for TaskFlow to be healthy
        run: |
          kubectl wait --for=condition=available --timeout=180s deployment/mongodb -n taskflow
          kubectl wait --for=condition=available --timeout=300s deployment/taskflow-backend -n taskflow
          kubectl wait --for=condition=available --timeout=180s deployment/taskflow-frontend -n taskflow
          kubectl get pods -n taskflow -o wide
          kubectl get svc -n taskflow

      - name: Smoke test backend API
        run: |
          kubectl port-forward -n taskflow svc/taskflow-backend 5000:5000 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5000/health >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:5000/health
          echo
          curl -sf http://127.0.0.1:5000/metrics | head -20
          echo
          curl -sf -X POST http://127.0.0.1:5000/api/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"Smoke test task"}'
          echo
          curl -sf http://127.0.0.1:5000/api/tasks
          echo

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd
          kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd

      - name: Register TaskFlow app in ArgoCD
        run: |
          sed -i "s|YOUR_GITHUB_USER/taskflow|${{ github.repository }}|g" argocd/application.yaml
          kubectl apply -f argocd/project.yaml
          kubectl apply -f argocd/application.yaml
          kubectl get applications -n argocd

      - name: Install kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          kubectl create namespace monitoring
          helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.service.type=NodePort \
            --set grafana.service.nodePort=32000 \
            --set prometheus.service.type=NodePort \
            --set prometheus.service.nodePort=32090 \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.retention=6h \
            --set prometheus.prometheusSpec.resources.requests.memory=256Mi \
            --set prometheus.prometheusSpec.resources.limits.memory=1Gi \
            --wait --timeout=10m
          kubectl apply -f k8s/overlays/dev/service-monitor.yaml

      - name: Dump diagnostics
        if: always()
        run: |
          echo "=== ArgoCD Apps ==="
          kubectl get applications -n argocd -o wide || true
          echo "=== All Pods ==="
          kubectl get pods -A || true
          echo "=== TaskFlow Events ==="
          kubectl get events -n taskflow --sort-by=.lastTimestamp || true
          echo "=== Backend describe ==="
          kubectl describe deployment taskflow-backend -n taskflow || true

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name "${{ env.KIND_CLUSTER }}"
