name: Update Kubernetes Manifests

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abcd123)"
        required: true
      environment:
        description: "Target environment"
        required: true
        default: dev

jobs:
  bump-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in kustomization
        run: |
          cd k8s/overlays/${{ inputs.environment }}
          sed -i "s|newTag: .*|newTag: ${{ inputs.image_tag }}|" kustomization.yaml
          cat kustomization.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ inputs.environment }}/kustomization.yaml
          git commit -m "chore: bump image tag to ${{ inputs.image_tag }}" || echo "No changes"
          git push
